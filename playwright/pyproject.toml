[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rel-playwright"
version = "0.1.0"
description = "Playwright-shaped Python scraping through REL browser sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "REL" }]
dependencies = ["selectolax>=0.3.33,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.urls]
Documentation = "https://docs.rel.me/playwright/"
Repository = "https://github.com/rel-me/rel-tools/tree/main/playwright"
Issues = "https://github.com/rel-me/rel-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rel_playwright = ["py.typed"]
