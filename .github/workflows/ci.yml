name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: [self-hosted, macOS, ARM64, rel-tools-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Isolate Rust toolchains from other runner services
        run: |
          export CARGO_HOME="$RUNNER_TOOL_CACHE/rel-tools-cargo"
          export RUSTUP_HOME="$RUNNER_TOOL_CACHE/rel-tools-rustup"
          if [[ ! -x "$CARGO_HOME/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- --default-toolchain none --no-modify-path -y
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rel-tools-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    runs-on: [self-hosted, macOS, ARM64, rel-tools-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Isolate Rust toolchains from other runner services
        run: |
          export CARGO_HOME="$RUNNER_TOOL_CACHE/rel-tools-cargo"
          export RUSTUP_HOME="$RUNNER_TOOL_CACHE/rel-tools-rustup"
          if [[ ! -x "$CARGO_HOME/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- --default-toolchain none --no-modify-path -y
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rel-tools-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.71.1
      - run: cargo check --workspace --all-targets

  ruby:
    runs-on: [self-hosted, macOS, ARM64, rel-tools-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Ruby 3.1
        env:
          # Upstream fix for locating socket headers in modern Xcode SDKs.
          MISE_RUBY_APPLY_PATCHES: https://github.com/ruby/ruby/commit/cb18deee7285dde67102c9702796d7eba0046af5.patch
        run: |
          /opt/homebrew/bin/mise install ruby@3.1
          ruby_root="$(/opt/homebrew/bin/mise where ruby@3.1)"
          "$ruby_root/bin/ruby" -rsocket -ropenssl -e 'puts RUBY_VERSION'
          echo "$ruby_root/bin" >> "$GITHUB_PATH"
          echo "BUNDLE_PATH=$RUNNER_TEMP/rel-tools-bundle" >> "$GITHUB_ENV"
      - run: bundle install
      - run: bundle exec rake test
      - run: gem build rel-client.gemspec

  python:
    runs-on: [self-hosted, macOS, ARM64, rel-tools-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: rel-crawler --version
      - run: python -m rel_crawler --version
      - run: python -m build

  crawlee:
    runs-on: [self-hosted, macOS, ARM64, rel-tools-ci]
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade build
      - run: python -m pip install -e playwright -e crawlee
      - run: python -m unittest discover -s playwright/tests -v
      - run: python -m unittest discover -s crawlee/tests -v
      - run: python -m build playwright
      - run: python -m build crawlee

  docs:
    runs-on: [self-hosted, macOS, ARM64, rel-tools-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
